name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 - ubuntu-latest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install Linux Tk runtime
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra dev
      - name: Python dependency vulnerability gate
        if: matrix.shard == 1
        run: python scripts/dependency_audit.py --ecosystem python
      - name: Ruff formatting
        if: matrix.shard == 0
        run: python -m ruff format --check .
      - name: Ruff lint
        if: matrix.shard == 0
        run: python -m ruff check .
      - name: Mypy
        if: matrix.shard == 0
        run: python -m mypy packages/allthecontext/src
      - name: Documentation checks
        if: matrix.shard == 0
        run: python scripts/check_docs.py
      - name: Tests and platform smoke coverage
        run: python scripts/run_test_shard.py --shard-index ${{ matrix.shard }}
      - name: Upload exact pytest execution receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: pytest-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}
          path: |
            .test-runs/pytest-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}/shard.json
            .test-runs/pytest-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}/canonical.json
            .test-runs/pytest-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}/retrieval.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Build Python artifacts
        if: matrix.shard == 0
        run: python -m build --outdir dist/python
      - name: Diagnose Python package resources
        if: matrix.shard == 0
        run: python scripts/diagnose_python_packages.py --directory dist/python

  python-windows-shard:
    name: Python 3.12 - windows-latest shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Create fresh run-owned Windows environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'atc-pytest-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}'
          if (Test-Path -LiteralPath $venv) {
            throw "Refusing to reuse Windows build environment: $venv"
          }
          python -m venv --without-pip $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra dev --installer uv
      - name: Ruff formatting
        if: matrix.shard == 0
        run: python -m ruff format --check .
      - name: Ruff lint
        if: matrix.shard == 0
        run: python -m ruff check .
      - name: Mypy
        if: matrix.shard == 0
        run: python -m mypy packages/allthecontext/src
      - name: Documentation checks
        if: matrix.shard == 0
        run: python scripts/check_docs.py
      - name: Tests and platform smoke coverage
        run: python scripts/run_test_shard.py --shard-index ${{ matrix.shard }}
      - name: Upload exact pytest execution receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: pytest-${{ github.run_id }}-${{ github.run_attempt }}-windows-${{ matrix.shard }}
          path: |
            .test-runs/pytest-${{ github.run_id }}-${{ github.run_attempt }}-windows-${{ matrix.shard }}/shard.json
            .test-runs/pytest-${{ github.run_id }}-${{ github.run_attempt }}-windows-${{ matrix.shard }}/canonical.json
            .test-runs/pytest-${{ github.run_id }}-${{ github.run_attempt }}-windows-${{ matrix.shard }}/retrieval.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload detached uninstall lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: detached-uninstall-lifecycle-windows-shard-${{ matrix.shard }}
          path: |
            .test-runs/windows-install-removal-*.json
            .test-runs/windows-install-removal-*.lifecycle.*
            .test-runs/windows-install-failure-*.json
            .test-runs/windows-install-failure-*.lifecycle.*
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Build Python artifacts
        if: matrix.shard == 0 || matrix.shard == 1
        run: python -m build --outdir dist/python
      - name: Diagnose Python package resources
        if: matrix.shard == 0 || matrix.shard == 1
        run: python scripts/diagnose_python_packages.py --directory dist/python

  python-linux:
    name: Python 3.12 - ubuntu-latest
    if: ${{ always() }}
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # pin: actions/download-artifact@v4
        with:
          pattern: pytest-${{ github.run_id }}-${{ github.run_attempt }}-linux-*
          path: .test-runs/receipts
          merge-multiple: false
      - name: Require canonical and actual worker coverage
        env:
          SHARD_RESULT: ${{ needs.python.result }}
        run: >-
          python scripts/check_test_collection.py
          --verify-receipts .test-runs/receipts
          --platform linux
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --shard-result "$SHARD_RESULT"

  python-windows:
    name: Python 3.12 - windows-latest
    if: ${{ always() }}
    needs: python-windows-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # pin: actions/download-artifact@v4
        with:
          pattern: pytest-${{ github.run_id }}-${{ github.run_attempt }}-windows-*
          path: .test-runs/receipts
          merge-multiple: false
      - name: Require canonical and actual worker coverage
        env:
          SHARD_RESULT: ${{ needs.python-windows-shard.result }}
        run: >-
          python scripts/check_test_collection.py
          --verify-receipts .test-runs/receipts
          --platform windows
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --shard-result "$SHARD_RESULT"

  security:
    name: Repository security gates
    # The dashboard matrix releases two hosted slots for these checks.
    needs: dashboard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra dev
      - name: Verify third-party Actions pins
        run: python scripts/verify_actions_pins.py
      - name: Content-free tree security scan
        run: python scripts/repository_security_scan.py --scope tree
      - name: Content-free history security scan
        run: python scripts/repository_security_scan.py --scope history
      - name: Reject tracked private-key material
        run: python scripts/release_keyring.py audit
      - name: Validate acceptance receipt templates
        run: |
          python scripts/acceptance_receipt.py validate --receipt release/acceptance-receipt.template.json
          python scripts/acceptance_receipt.py validate-bundle --bundle release/acceptance-receipt-bundle.template.json
          python scripts/acceptance_receipt.py validate-bundle --bundle release/lean-beta-receipt-bundle.template.json

  dashboard:
    name: Dashboard - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Dashboard high-severity dependency audit
        if: matrix.node == 22
        run: npm audit --audit-level=high

  dashboard-parity:
    name: Dashboard production asset parity
    # The dashboard matrix releases two hosted slots for these checks.
    needs: dashboard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py
      - name: Verify committed dashboard assets match production build
        run: python scripts/verify_dashboard_parity.py

  desktop-package:
    # Keep these check names stable for branch protection.
    name: Desktop artifact - ${{ matrix.check_label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_label: windows-latest
            runner: windows-latest
            platform: windows
            architecture: x86_64
            source: AllTheContextSetup.exe
          - check_label: ubuntu-latest
            runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            source: all-the-context
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: ${{ runner.os == 'Linux' && 'pip' || '' }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Verify native runner architecture label
        run: >-
          python scripts/check_runner_architecture.py
          --expected ${{ matrix.architecture }}
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Start frozen Windows CI donor download
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/windows_ci_pilot.py start
      - name: Create fresh run-owned Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'atc-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}'
          if (Test-Path -LiteralPath $venv) {
            throw "Refusing to reuse Windows build environment: $venv"
          }
          python -m venv --without-pip $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Windows desktop packager from reviewed lock constraints
        if: runner.os == 'Windows'
        run: python scripts/install_locked_python.py --extra packaging --installer uv
      - name: Install desktop packager from reviewed lock constraints
        if: runner.os != 'Windows'
        run: python scripts/install_locked_python.py --extra packaging
      - name: Exercise native startup and OS credential adapters
        if: runner.os != 'Linux'
        run: python scripts/smoke_platform_acceptance.py --require-os-credential
      - name: Exercise Linux startup and explicit credential fallback
        if: runner.os == 'Linux'
        run: python scripts/smoke_platform_acceptance.py
      - id: windows_native
        name: Build and verify reproducible Windows native components
        if: runner.os == 'Windows'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/verify_reproducible_build.py
          --source-commit ${{ github.sha }}
          --output-dir dist/native-build-provenance
          ${{ github.event_name == 'pull_request' && '--parallel-windows' || '' }}
          ${{ github.event_name == 'pull_request' && '--windows-ci-donor-pilot' || '' }}
      - name: Build native desktop artifact
        if: runner.os != 'Windows'
        run: python scripts/build_desktop.py
      - name: Smoke-test bundled resources and packaged OS credential access
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: >-
          python scripts/smoke_desktop_artifact.py
          --artifact-root .
          --provenance-manifest dist/native-build-provenance/native-build-provenance-v1.json
          --provenance-checksum dist/native-build-provenance/native-build-provenance-v1.json.sha256
      - name: Smoke packaged console recovery from built bytes
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: >-
          python scripts/smoke_packaged_recovery.py
          --artifact-root .
          --provenance-manifest dist/native-build-provenance/native-build-provenance-v1.json
          --provenance-checksum dist/native-build-provenance/native-build-provenance-v1.json.sha256
      - name: Prepare Windows packaged first-run diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inventory = Join-Path $env:RUNNER_TEMP 'packaged-first-run-process-inventory'
          $failure = Join-Path $env:RUNNER_TEMP 'packaged-first-run-failure-diagnostics'
          New-Item -ItemType Directory -Force -Path $inventory, $failure | Out-Null
          "ATC_PACKAGED_PROCESS_INVENTORY_DIAGNOSTICS_DIR=$inventory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ATC_PACKAGED_FAILURE_DIAGNOSTICS_DIR=$failure" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - id: windows_package_checks
        name: Windows PR lifecycle with independent built-file package preparation
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        env:
          ATC_CI_WINDOWS_COM_INVENTORY: "1"
        run: >-
          python scripts/windows_ci_package_checks.py
          ${{ steps.windows_native.outputs.route == 'retained' && '--overlap-first-run' || '' }}
      - id: packaged_smoke
        name: Clean-install, startup, MCP, restart, and cleanup smoke
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: >-
          python scripts/smoke_packaged_first_run.py
          --artifact-root .
          --provenance-manifest dist/native-build-provenance/native-build-provenance-v1.json
          --provenance-checksum dist/native-build-provenance/native-build-provenance-v1.json.sha256
      - name: Upload packaged first-run failure diagnostics
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: packaged-first-run-failure-diagnostics-windows
          path: ${{ runner.temp }}/packaged-first-run-failure-diagnostics/*.json
          if-no-files-found: ignore
      - name: Upload packaged first-run process-inventory diagnostics
        if: ${{ always() && runner.os == 'Windows' && (steps.packaged_smoke.outcome == 'success' || steps.windows_package_checks.outputs.lifecycle_success == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: packaged-first-run-process-inventory-windows
          path: ${{ runner.temp }}/packaged-first-run-process-inventory/*.json
          if-no-files-found: error
      - id: runtime-version
        name: Read runtime version
        shell: python
        run: |
          import os
          from allthecontext import __version__
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={__version__}\n")
      - name: Build direct unsigned platform package
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: >-
          python scripts/package_desktop.py
          --version ${{ steps.runtime-version.outputs.version }}
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
          --output-dir dist/platform
      - name: Record AppImage spike decision
        if: runner.os == 'Linux'
        run: >-
          python scripts/evaluate_appimage.py
          --output dist/platform/appimage-evaluation.json
      - name: Smoke-test direct platform package and trust disclosure
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: >-
          python scripts/smoke_platform_package.py
          --directory dist/platform
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
      - name: Create deterministic candidate archive and metadata
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: >-
          python scripts/build_release_assets.py
          --source dist/desktop/${{ matrix.source }}
          --output-dir dist/release
          --version ${{ steps.runtime-version.outputs.version }}
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: all-the-context-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/platform/**
            dist/release/**
            dist/native-build-provenance/**
          compression-level: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && '0' || '6' }}
          if-no-files-found: error
