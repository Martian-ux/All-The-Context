name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra dev
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy packages/allthecontext/src
      - name: Documentation checks
        run: python scripts/check_docs.py
      - name: Tests and platform smoke coverage
        run: python -m pytest
      - name: Build Python artifacts
        run: python -m build --outdir dist/python
      - name: Diagnose Python package resources
        run: python scripts/diagnose_python_packages.py --directory dist/python
      - name: Python dependency vulnerability gate
        if: runner.os == 'Linux'
        run: python scripts/dependency_audit.py --ecosystem python

  security:
    name: Repository security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra dev
      - name: Verify third-party Actions pins
        run: python scripts/verify_actions_pins.py
      - name: Content-free tree security scan
        run: python scripts/repository_security_scan.py --scope tree
      - name: Content-free history security scan
        run: python scripts/repository_security_scan.py --scope history
      - name: Reject tracked private-key material
        run: python scripts/release_keyring.py audit
      - name: Validate acceptance receipt templates
        run: |
          python scripts/acceptance_receipt.py validate --receipt release/acceptance-receipt.template.json
          python scripts/acceptance_receipt.py validate-bundle --bundle release/acceptance-receipt-bundle.template.json
          python scripts/acceptance_receipt.py validate-bundle --bundle release/lean-beta-receipt-bundle.template.json

  dashboard:
    name: Dashboard - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Dashboard high-severity dependency audit
        run: npm audit --audit-level=high

  dashboard-parity:
    name: Dashboard production asset parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py
      - name: Verify committed dashboard assets match production build
        run: python scripts/verify_dashboard_parity.py

  desktop-package:
    name: Desktop artifact - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x86_64
            source: AllTheContextSetup.exe
          - os: macos-26
            platform: macos
            architecture: arm64
            source: AllTheContext.app
          - os: macos-26-intel
            platform: macos
            architecture: x86_64
            source: AllTheContext.app
          - os: ubuntu-latest
            platform: linux
            architecture: x86_64
            source: all-the-context
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Verify native runner architecture label
        run: >-
          python scripts/check_runner_architecture.py
          --expected ${{ matrix.architecture }}
      - name: Record content-free macOS host preflight
        if: runner.os == 'macOS'
        run: >-
          python scripts/macos_acceptance_preflight.py
          --profile hosted-ci
          --expected-architecture ${{ matrix.architecture }}
          --expected-major 26
          --output dist/macos-preflight/${{ matrix.architecture }}-hosted-ci.json
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install desktop packager from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra packaging
      - name: Exercise native startup and OS credential adapters
        if: runner.os != 'Linux'
        run: python scripts/smoke_platform_acceptance.py --require-os-credential
      - name: Exercise Linux startup and explicit credential fallback
        if: runner.os == 'Linux'
        run: python scripts/smoke_platform_acceptance.py
      - name: Build native desktop artifact
        run: python scripts/build_desktop.py
      - name: Smoke-test bundled resources and packaged OS credential access
        run: python scripts/smoke_desktop_artifact.py
      - name: Smoke packaged console recovery from built bytes
        run: python scripts/smoke_packaged_recovery.py
      - name: Clean-install, startup, MCP, restart, and cleanup smoke
        run: python scripts/smoke_packaged_first_run.py
      - id: runtime-version
        name: Read runtime version
        shell: python
        run: |
          import os
          from allthecontext import __version__
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={__version__}\n")
      - name: Build direct unsigned platform package
        run: >-
          python scripts/package_desktop.py
          --version ${{ steps.runtime-version.outputs.version }}
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
          --output-dir dist/platform
      - name: Record AppImage spike decision
        if: runner.os == 'Linux'
        run: >-
          python scripts/evaluate_appimage.py
          --output dist/platform/appimage-evaluation.json
      - name: Smoke-test direct platform package and trust disclosure
        run: >-
          python scripts/smoke_platform_package.py
          --directory dist/platform
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
      - name: Create deterministic candidate archive and metadata
        run: >-
          python scripts/build_release_assets.py
          --source dist/desktop/${{ matrix.source }}
          --output-dir dist/release
          --version ${{ steps.runtime-version.outputs.version }}
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: all-the-context-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/platform/**
            dist/release/**
            dist/macos-preflight/**
          if-no-files-found: error
