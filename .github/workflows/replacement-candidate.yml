name: Private Windows replacement candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer for the private replacement candidate
        required: true
        type: string
      source_commit:
        description: Full 40-character SHA of the protected-main dispatch head
        required: true
        type: string

concurrency:
  group: replacement-candidate-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      artifact-metadata: write
      contents: read
    steps:
      - name: Bind source to protected-main dispatch SHA
        shell: pwsh
        env:
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REQUESTED_REF -cne $env:DEFAULT_BRANCH_REF) {
            throw "Replacement candidates must be dispatched from the default branch"
          }
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw "source_commit must be a full lowercase commit SHA"
          }
          if ($env:DISPATCH_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "github.sha must be a full lowercase commit SHA"
          }
          if ($env:SOURCE_COMMIT -cne $env:DISPATCH_SHA) {
            throw "source_commit must equal the triggering protected-main SHA"
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install packaging dependencies from the reviewed lock
        run: python scripts/install_locked_python.py --extra packaging
      - name: Validate exact source metadata and Windows runner
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/release_candidate.py validate-source
          --version "$env:VERSION"
          --channel beta
          --source-commit "$env:SOURCE_COMMIT"
      - name: Validate native Windows x86-64 runner
        run: >-
          python scripts/release_candidate.py validate-runner
          --platform windows
          --architecture x86_64
      - name: Build native desktop bytes without executing them
        run: python scripts/build_desktop.py
      - name: Build direct unsigned package and installed-component provenance
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/package_desktop.py
          --platform windows
          --architecture x86_64
          --version "$env:VERSION"
          --source-commit "$env:SOURCE_COMMIT"
          --installed-component-output-dir dist/installed-component-package
          --output-dir dist/release
      - name: Build deterministic Windows archive and metadata
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python scripts/build_release_assets.py
          --source dist/installed-component-package
          --output-dir dist/release
          --version "$env:VERSION"
          --platform windows
          --architecture x86_64
      - name: Build direct package SPDX subject metadata
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python scripts/build_release_assets.py
          --source "dist/release/all-the-context-$env:VERSION-windows-x86_64-unsigned.exe"
          --output-dir dist/release
          --version "$env:VERSION"
          --platform windows
          --architecture x86_64
          --subject-metadata-only
      - name: Verify installed-component manifest and archive statically
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/installed_component_manifest.py verify-archive
          --archive "dist/release/all-the-context-$env:VERSION-windows-x86_64.zip"
          --direct-package "dist/release/all-the-context-$env:VERSION-windows-x86_64-unsigned.exe"
          --main dist/desktop/AllTheContextSetup.exe
          --mcp build/desktop/helper-dist/AllTheContextMCP.exe
          --recovery dist/desktop/AllTheContextRecovery.exe
          --updater build/desktop/update-helper-dist/AllTheContextUpdater.exe
          --source-root .
          --version "$env:VERSION"
          --source-commit "$env:SOURCE_COMMIT"
          --platform windows
          --architecture x86_64
      - name: Scan candidate files without executing them
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/repository_security_scan.py
          --scope artifacts
          --artifact-dir dist/release
          --source-commit "$env:SOURCE_COMMIT"
      - name: Upload private Windows candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: replacement-candidate-windows-${{ inputs.version }}-${{ github.sha }}
          path: |
            dist/release/**
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
