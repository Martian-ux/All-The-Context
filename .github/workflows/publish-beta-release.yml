name: Publish verified beta release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact beta tag (for example v0.1.0-beta.2)
        required: true
        type: string
      source_commit:
        description: Reviewed full 40-character release commit
        required: true
        type: string
      candidate_sha256:
        description: Reviewed SHA-256 of release-candidate-v1.json
        required: true
        type: string
      receipt_bundle_json:
        description: Content-free acceptance receipt bundle JSON (explicit maintainer decision required)
        required: true
        type: string
      key_id:
        description: Reviewed public release key ID
        required: true
        type: string
        default: release-2026-a
      expected_public_key_sha256:
        description: Reviewed public-key fingerprint (sha256:<hex>)
        required: true
        type: string
        default: sha256:fe05a2bd52db97f808650fb0e832c49bd704abd62a813af4dedca4994f98e0d4
      approval:
        description: Type PUBLISH UNSIGNED BETA
        required: true
        type: string

concurrency:
  group: publish-beta-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    environment: release-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Require deliberate operator preflight phrase
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
        run: test "$APPROVAL" = "PUBLISH UNSIGNED BETA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py
      - name: Verify unpublished beta release state
        id: draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > dist/release-list.json
          release_id="$(
            python scripts/release_candidate.py resolve-release \
              --input dist/release-list.json \
              --tag "$TAG" \
              --source-commit "$SOURCE_COMMIT" \
              --draft true \
              --immutable false \
              --output dist/release-state.json
          )"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > dist/release-state-by-id.json
          python scripts/release_candidate.py verify-release-state \
            --input dist/release-state-by-id.json \
            --tag "$TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --draft true \
            --immutable false
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Download candidate without replacing any asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          set -o noclobber
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "dist/release/$asset_name"
          done < <(
            python scripts/release_candidate.py list-release-assets \
              --input dist/release-state.json
          )
      - name: Materialize operator acceptance receipt bundle
        env:
          RECEIPT_BUNDLE_JSON: ${{ inputs.receipt_bundle_json }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ["RECEIPT_BUNDLE_JSON"]
          value = json.loads(raw)
          path = pathlib.Path("dist/evidence/acceptance-receipt-bundle-v1.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path)
          PY
      - name: Verify signed candidate inventory before decision artifacts
        run: |
          python scripts/release_candidate.py verify \
            --release-dir dist/release \
            --expected-sha256 "${{ inputs.candidate_sha256 }}" \
            --target windows:x86_64 \
            --target linux:x86_64 \
            --ota-target windows:x86_64 \
            --asset-stage signed
          python scripts/release_candidate.py verify-release-state \
            --input dist/release-state.json \
            --tag "${{ inputs.tag }}" \
            --source-commit "${{ inputs.source_commit }}" \
            --draft true \
            --immutable false \
            --release-dir dist/release \
            --asset-stage signed
      - name: Fail-closed protected publication gate
        run: >-
          python scripts/publication_gate.py
          --release-dir dist/release
          --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          --source-commit "${{ inputs.source_commit }}"
          --receipt-bundle dist/evidence/acceptance-receipt-bundle-v1.json
          --key-id "${{ inputs.key_id }}"
          --expected-public-key-sha256 "${{ inputs.expected_public_key_sha256 }}"
          --asset-stage promotion
          --output dist/release/publication-gate-record.json
      - name: Attest acceptance receipt bundle and publication record
        id: decision_attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # pin: actions/attest@v4
        with:
          subject-path: |
            dist/release/acceptance-receipt-bundle-v1.json
            dist/release/publication-gate-record.json
      - name: Upload decision artifacts to the draft before final recheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        run: |
          set -euo pipefail
          for asset in \
            dist/release/acceptance-receipt-bundle-v1.json \
            dist/release/publication-gate-record.json; do
            asset_name="$(basename "$asset")"
            gh api \
              --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset_name" \
              --input "$asset" \
              > /dev/null
          done
      - name: Verify exact build workflow, commit, provenance, and SBOM attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release-candidate.yml
        run: |
          set -euo pipefail
          for subject in dist/release/*.zip dist/release/*-unsigned.exe dist/release/*-unsigned.tar.gz; do
            [[ -f "$subject" ]] || continue
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$subject.provenance.sigstore.json" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_COMMIT" \
              --deny-self-hosted-runners
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$subject.sbom.sigstore.json" \
              --predicate-type "https://spdx.dev/Document/v2.3" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_COMMIT" \
              --deny-self-hosted-runners
          done
          gh attestation verify dist/release/release-candidate-v1.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle dist/release/release-candidate-v1.json.provenance.sigstore.json \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$SOURCE_COMMIT" \
            --deny-self-hosted-runners
      - name: Verify every offline-signed manifest and OTA artifact binding
        run: >-
          python scripts/release_channel.py prepare
          --release-dir dist/release
          --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          --repository "${{ github.repository }}"
          --source-commit "${{ inputs.source_commit }}"
          --output-dir dist/channel-preflight
      - name: Recheck the exact promotion asset set immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > dist/pre-publish-release-state.json
          python scripts/release_candidate.py verify-release-state \
            --input dist/pre-publish-release-state.json \
            --tag "${{ inputs.tag }}" \
            --source-commit "${{ inputs.source_commit }}" \
            --draft true \
            --immutable false \
            --release-dir dist/release \
            --asset-stage promotion
      - name: Publish only after protected-environment approval and all verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        run: >-
          gh api
          --method PATCH
          "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          -F draft=false
          -F prerelease=true
          > /dev/null
      - name: Require immutable published state and GitHub release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" \
            --json tagName,targetCommitish,isDraft,isImmutable,isPrerelease,assets \
            > dist/published-release-state.json
          python scripts/release_candidate.py verify-release-state \
            --input dist/published-release-state.json \
            --tag "${{ inputs.tag }}" \
            --source-commit "${{ inputs.source_commit }}" \
            --draft false \
            --immutable true \
            --release-dir dist/release \
            --asset-stage promotion
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${{ inputs.tag }}" \
              --jq .object.sha
          )" = "${{ inputs.source_commit }}"
          gh release verify "${{ inputs.tag }}"
