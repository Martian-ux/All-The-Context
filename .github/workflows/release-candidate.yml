name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer (stable x.y.z or beta x.y.z-beta.N)
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        type: choice
        options: [beta, stable]
      source_commit:
        description: Full 40-character commit SHA at the default-branch head
        required: true
        type: string
      approval:
        description: After owner preflight, type BUILD IMMUTABLE CANDIDATE
        required: true
        type: string

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require deliberate operator preflight phrase
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
        run: test "$APPROVAL" = "BUILD IMMUTABLE CANDIDATE"
      - name: Bind requested source to default-branch dispatch SHA
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF" = "$DEFAULT_BRANCH_REF"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$DISPATCH_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra dev
      - name: Validate exact source and Python/SemVer metadata
        run: >-
          python scripts/release_candidate.py validate-source
          --version "${{ inputs.version }}"
          --channel "${{ inputs.channel }}"
          --source-commit "${{ inputs.source_commit }}"
      - name: Require exact green source-health matrix plus security/parity jobs on this SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/exact_source_gate.py hosted-matrix
          --repository "${{ github.repository }}"
          --source-commit "${{ inputs.source_commit }}"
          --output dist/matrix-evidence.json
      - name: Rerun exact local quality gates on the candidate SHA
        run: python scripts/exact_source_gate.py local-quality
      - name: Verify third-party Actions pins
        run: python scripts/verify_actions_pins.py
      - name: Content-free tree and history security scans
        run: |
          python scripts/repository_security_scan.py --scope tree --source-commit "${{ inputs.source_commit }}"
          python scripts/repository_security_scan.py --scope history --source-commit "${{ inputs.source_commit }}"
      - name: Reject tracked private-key material
        run: python scripts/release_keyring.py audit
      - name: Require a reviewed public key for this channel
        run: >-
          python scripts/release_keyring.py validate
          --require-channel "${{ inputs.channel }}"
      - name: Python dependency vulnerability gate
        run: python scripts/dependency_audit.py --ecosystem python
      - name: Dashboard install, check, test, build, and high-severity audit
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Verify committed dashboard assets match production build
        run: python scripts/verify_dashboard_parity.py --source-commit "${{ inputs.source_commit }}" --built-dist apps/dashboard/dist
      - name: Build component inventory and notices from reviewed locks
        run: >-
          python scripts/build_component_inventory.py
          --version "${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --output-dir dist/inventory
      - name: Require operator-verified immutability, default-branch head, and unused version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/github_release_gate.py
          --repository "${{ github.repository }}"
          --version "${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --operator-verified-immutability
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: candidate-source-evidence
          path: |
            dist/matrix-evidence.json
            dist/inventory/**
          if-no-files-found: error
          retention-days: 14

  native:
    needs: validate
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x86_64
            source: AllTheContextSetup.exe
            archive_source: dist/installed-component-package
            package_suffix: .exe
          - os: ubuntu-latest
            platform: linux
            architecture: x86_64
            source: all-the-context
            archive_source: dist/desktop/all-the-context
            package_suffix: .tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Bind requested source to default-branch dispatch SHA
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF" = "$DEFAULT_BRANCH_REF"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$DISPATCH_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install packaging extras from reviewed lock constraints
        run: python scripts/install_locked_python.py --extra packaging
      - name: Reject a mislabeled or non-native runner
        run: >-
          python scripts/release_candidate.py validate-runner
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
      - name: Build and verify reproducible Windows native components
        if: matrix.platform == 'windows'
        run: >-
          python scripts/verify_reproducible_build.py
          --version "${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --output-dir dist/native-build-provenance
      - name: Build native Linux desktop artifact
        if: matrix.platform == 'linux'
        run: python scripts/build_desktop.py
      - run: python scripts/smoke_desktop_artifact.py
      - run: python scripts/smoke_packaged_recovery.py
      - run: python scripts/smoke_packaged_first_run.py
      - name: Build direct unsigned native package and disclosure sidecars
        run: >-
          python scripts/package_desktop.py
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --version "${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --installed-component-output-dir dist/installed-component-package
          --output-dir dist/release
      - name: Verify direct package identity, architecture, and trust boundary
        run: >-
          python scripts/smoke_platform_package.py
          --directory dist/release
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
      - name: Build deterministic archive, checksum, and SPDX inventory
        run: >-
          python scripts/build_release_assets.py
          --source "${{ matrix.archive_source }}"
          --output-dir dist/release
          --version "${{ inputs.version }}"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
      - name: Verify Windows installed-component provenance is bound to the archive
        if: matrix.platform == 'windows'
        run: >-
          python scripts/installed_component_manifest.py verify-archive
          --archive dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}.zip
          --direct-package dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned.exe
          --main dist/desktop/AllTheContextSetup.exe
          --mcp build/desktop/helper-dist/AllTheContextMCP.exe
          --recovery dist/desktop/AllTheContextRecovery.exe
          --updater build/desktop/update-helper-dist/AllTheContextUpdater.exe
          --source-root .
          --version "${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --platform windows
          --architecture x86_64
      - name: Build SPDX subject document for direct native package
        run: >-
          python scripts/build_release_assets.py
          --source dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned${{ matrix.package_suffix }}
          --output-dir dist/release
          --version "${{ inputs.version }}"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --subject-metadata-only
      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # pin: actions/attest@v4
        with:
          subject-path: >-
            dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}.zip
      - name: Attest SPDX inventory
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # pin: actions/attest@v4
        with:
          subject-path: >-
            dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}.zip
          sbom-path: >-
            dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}.zip.spdx.json
      - name: Attest direct native package SLSA provenance
        id: package_provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # pin: actions/attest@v4
        with:
          subject-path: >-
            dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned${{ matrix.package_suffix }}
      - name: Attest direct native package SPDX subject
        id: package_sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # pin: actions/attest@v4
        with:
          subject-path: >-
            dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned${{ matrix.package_suffix }}
          sbom-path: >-
            dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned${{ matrix.package_suffix }}.spdx.json
      - name: Attach offline-verifiable attestation bundles
        run: >-
          python scripts/release_candidate.py attach-attestations
          --release-dir dist/release
          --provenance-bundle "${{ steps.provenance.outputs.bundle-path }}"
          --sbom-bundle "${{ steps.sbom.outputs.bundle-path }}"
      - name: Attach direct native package attestation bundles
        run: >-
          python scripts/release_candidate.py attach-attestations
          --release-dir dist/release
          --subject dist/release/all-the-context-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned${{ matrix.package_suffix }}
          --provenance-bundle "${{ steps.package_provenance.outputs.bundle-path }}"
          --sbom-bundle "${{ steps.package_sbom.outputs.bundle-path }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Windows reproducibility evidence separately from release assets
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pin: actions/upload-artifact@v4
        with:
          name: native-build-provenance-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/native-build-provenance/**
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [validate, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Bind requested source to default-branch dispatch SHA
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF" = "$DEFAULT_BRANCH_REF"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$DISPATCH_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pin: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pin: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pin: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Install from reviewed lock constraints
        run: python scripts/install_locked_python.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # pin: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # pin: actions/download-artifact@v4
        with:
          name: candidate-source-evidence
          path: dist/source-evidence
      - name: Content-free candidate artifact security scan
        run: >-
          python scripts/repository_security_scan.py
          --scope artifacts
          --artifact-dir dist/release
          --source-commit "${{ inputs.source_commit }}"
      - name: Verify native SLSA and SPDX attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release-candidate.yml
        run: |
          set -euo pipefail
          for subject in dist/release/*.zip dist/release/*-unsigned.exe dist/release/*-unsigned.tar.gz; do
            [[ -f "$subject" ]] || continue
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$subject.provenance.sigstore.json" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_COMMIT" \
              --deny-self-hosted-runners
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$subject.sbom.sigstore.json" \
              --predicate-type "https://spdx.dev/Document/v2.3" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_COMMIT" \
              --deny-self-hosted-runners
          done
      - name: Stage inventory files into the release directory
        shell: bash
        run: |
          set -euo pipefail
          # Inventory may land under dist/source-evidence/inventory/ from the upload layout.
          mkdir -p dist/source-evidence
          if [[ -f dist/source-evidence/inventory/component-inventory-v1.json ]]; then
            cp dist/source-evidence/inventory/component-inventory-v1.json dist/source-evidence/
            cp dist/source-evidence/inventory/component-inventory-v1.json.sha256 dist/source-evidence/
            cp dist/source-evidence/inventory/NOTICES.txt dist/source-evidence/
          fi
          test -f dist/source-evidence/matrix-evidence.json
          test -f dist/source-evidence/component-inventory-v1.json
          test -f dist/source-evidence/component-inventory-v1.json.sha256
          test -f dist/source-evidence/NOTICES.txt
      - name: Assemble and verify the exact candidate inventory
        run: >-
          python scripts/release_candidate.py assemble
          --release-dir dist/release
          --source-evidence-dir dist/source-evidence
          --version "${{ inputs.version }}"
          --channel "${{ inputs.channel }}"
          --source-commit "${{ inputs.source_commit }}"
          --target windows:x86_64
          --target linux:x86_64
          --ota-target windows:x86_64
      - name: Attest candidate inventory provenance
        id: candidate_provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # pin: actions/attest@v4
        with:
          subject-path: dist/release/release-candidate-v1.json
      - name: Preserve candidate inventory attestation bundle
        env:
          BUNDLE: ${{ steps.candidate_provenance.outputs.bundle-path }}
        run: >-
          cp "$BUNDLE"
          dist/release/release-candidate-v1.json.provenance.sigstore.json
      - name: Verify candidate inventory provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify dist/release/release-candidate-v1.json
          --repo "${{ github.repository }}"
          --bundle dist/release/release-candidate-v1.json.provenance.sigstore.json
          --signer-workflow "${{ github.repository }}/.github/workflows/release-candidate.yml"
          --source-digest "${{ inputs.source_commit }}"
          --deny-self-hosted-runners
      - name: Recheck the operator-confirmed unused release slot after the build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/github_release_gate.py
          --repository "${{ github.repository }}"
          --version "${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --operator-verified-immutability
          --allow-default-branch-advance
      - name: Write explicit unsigned candidate notes
        run: >-
          python scripts/release_candidate.py write-notes
          --release-dir dist/release
          --output dist/release-notes.md
      - name: Create a single-use unpublished draft from the exact allowlist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            python scripts/release_candidate.py list-assets \
              --release-dir dist/release \
              --stage draft
          )
          (( ${#assets[@]} > 0 ))
          prerelease=()
          if [[ "$CHANNEL" == "beta" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --draft \
            "${prerelease[@]}" \
            --target "$SOURCE_COMMIT" \
            --title "All The Context $TAG — unsigned community build" \
            --notes-file dist/release-notes.md
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > dist/draft-release-list.json
          release_id="$(
            python scripts/release_candidate.py resolve-release \
              --input dist/draft-release-list.json \
              --tag "$TAG" \
              --source-commit "$SOURCE_COMMIT" \
              --draft true \
              --immutable false \
              --release-dir dist/release \
              --asset-stage draft \
              --output dist/draft-release-state.json
          )"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > dist/draft-release-by-id.json
          python scripts/release_candidate.py verify-release-state \
            --input dist/draft-release-by-id.json \
            --tag "$TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --draft true \
            --immutable false \
            --release-dir dist/release \
            --asset-stage draft
